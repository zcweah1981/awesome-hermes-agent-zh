<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F8FB"/>
      <stop offset="0.55" stop-color="#EEF5FB"/>
      <stop offset="1" stop-color="#F9FBFD"/>
    </linearGradient>
    <linearGradient id="blue" x1="260" y1="120" x2="1320" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123D78"/>
      <stop offset="1" stop-color="#0B2B55"/>
    </linearGradient>
    <linearGradient id="green" x1="420" y1="240" x2="1180" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CD38A"/>
      <stop offset="1" stop-color="#16A35A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#123D78" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font: 800 58px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#123D78; }
      .h2 { font: 800 48px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#16A35A; }
      .h3 { font: 600 22px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#35506B; }
      .body { font: 500 18px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#4B6785; }
      .small { font: 600 16px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#123D78; }
      .chip { font: 700 16px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#123D78; }
      .muted { font: 500 15px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#637A95; }
      .nav { font: 600 15px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#335270; }
      .navStrong { font: 700 15px 'WenQuanYi Zen Hei','Source Han Sans SC','Inter','Microsoft YaHei',sans-serif; fill:#123D78; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.42">
    <path d="M120 130H1480" stroke="#D7E6F4" stroke-width="1"/>
    <path d="M120 790H1480" stroke="#D7E6F4" stroke-width="1"/>
  </g>

  <rect x="86" y="70" width="1428" height="760" rx="36" fill="rgba(255,255,255,0.7)" stroke="#DCE8F5" stroke-width="1.2" filter="url(#shadow)"/>

  <!-- top nav -->
  <g transform="translate(120 110)">
    <rect x="0" y="0" width="1360" height="64" rx="20" fill="#FFFFFF" stroke="#E4ECF5" stroke-width="1"/>
    <rect x="18" y="14" width="36" height="36" rx="10" fill="url(#green)"/>
    <text x="34" y="39" text-anchor="middle" font-family="WenQuanYi Zen Hei, Source Han Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">H</text>
    <text x="66" y="39" class="small">Hermes Agent 中文站</text>

    <g transform="translate(710 21)">
      <text class="nav" x="0" y="20">从这里开始</text>
      <text class="nav" x="110" y="20">现成方案</text>
      <text class="nav" x="220" y="20">国内落地</text>
      <text class="nav" x="330" y="20">遇到问题</text>
    </g>

    <g transform="translate(1110 15)">
      <circle cx="20" cy="17" r="10" fill="#EDF4FB" stroke="#C8D7E8"/>
      <path d="M16 16L24 16M16 21L21 21" stroke="#597088" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="48" y="4" width="116" height="40" rx="14" fill="url(#green)"/>
      <text class="navStrong" x="106" y="30" text-anchor="middle" fill="#FFFFFF">快速开始</text>
    </g>
  </g>

  <!-- main hero left -->
  <g transform="translate(150 235)">
    <text class="nav" x="0" y="0">中文场景 · 国产模型 · 企业协作 · 自动化</text>
    <text class="h1" x="0" y="82">让 Hermes 成为你的</text>
    <text class="h2" x="0" y="148">中文 AI 工作助手</text>
    <text class="h3" x="0" y="210">中文场景开箱即用，国产模型无缝接入，</text>
    <text class="h3" x="0" y="242">飞书 / 企微 / 钉钉直接对接，5 分钟跑通第一个任务。</text>

    <rect x="0" y="288" width="650" height="74" rx="22" fill="#FFFFFF" stroke="#D7E4F1" stroke-width="1.2"/>
    <text class="body" x="28" y="334">✧ 告诉它你要做什么，剩下的交给 Hermes</text>

    <rect x="0" y="390" width="170" height="54" rx="18" fill="url(#green)"/>
    <text class="navStrong" x="85" y="424" text-anchor="middle" fill="#FFFFFF">从这里开始 →</text>

    <g transform="translate(0 482)">
      <rect x="0" y="0" width="112" height="38" rx="19" fill="#EEF5FB" stroke="#D9E6F1"/>
      <text class="chip" x="56" y="25" text-anchor="middle">从这里开始</text>
      <rect x="124" y="0" width="112" height="38" rx="19" fill="#EEF5FB" stroke="#D9E6F1"/>
      <text class="chip" x="180" y="25" text-anchor="middle">国内落地</text>
      <rect x="248" y="0" width="140" height="38" rx="19" fill="#EEF5FB" stroke="#D9E6F1"/>
      <text class="chip" x="318" y="25" text-anchor="middle">从 OpenClaw 过来</text>
      <rect x="400" y="0" width="112" height="38" rx="19" fill="#EEF5FB" stroke="#D9E6F1"/>
      <text class="chip" x="456" y="25" text-anchor="middle">常见问题</text>
    </g>
  </g>

  <!-- right illustration -->
  <g transform="translate(910 220)" filter="url(#softGlow)">
    <!-- halo -->
    <circle cx="280" cy="210" r="170" fill="#EAF4FF" stroke="#C8D7E8" stroke-width="1.2"/>
    <circle cx="280" cy="210" r="118" fill="#FFFFFF" stroke="#C8D7E8" stroke-width="1"/>

    <!-- Hermes messenger mark -->
    <g transform="translate(185 75)">
      <path d="M118 56C84 56 60 82 60 114C60 146 84 172 118 172C152 172 176 146 176 114C176 82 152 56 118 56Z" fill="#FFFFFF" stroke="#123D78" stroke-width="4"/>
      <path d="M78 90C92 76 105 68 118 68C131 68 145 76 159 90" stroke="#123D78" stroke-width="5" stroke-linecap="round"/>
      <path d="M78 138C92 152 105 160 118 160C131 160 145 152 159 138" stroke="#123D78" stroke-width="5" stroke-linecap="round"/>
      <path d="M118 56L118 32" stroke="#123D78" stroke-width="5" stroke-linecap="round"/>
      <path d="M98 34L84 18" stroke="#123D78" stroke-width="5" stroke-linecap="round"/>
      <path d="M138 34L152 18" stroke="#123D78" stroke-width="5" stroke-linecap="round"/>
      <path d="M76 58L50 50" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M160 58L186 50" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <circle cx="118" cy="114" r="16" fill="#16A35A"/>
      <circle cx="118" cy="114" r="6" fill="#FFFFFF"/>
    </g>

    <!-- document sheet -->
    <g transform="translate(380 118)">
      <rect x="0" y="0" width="176" height="132" rx="18" fill="#FFFFFF" stroke="#123D78" stroke-width="4"/>
      <path d="M28 34H122" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 56H100" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 78H136" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 100H86" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <circle cx="144" cy="34" r="12" fill="#16A35A"/>
    </g>

    <!-- terminal sheet -->
    <g transform="translate(370 292)">
      <rect x="0" y="0" width="190" height="118" rx="18" fill="#123D78" stroke="#123D78" stroke-width="4"/>
      <path d="M26 34H84" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M26 58H140" stroke="#9FD7B7" stroke-width="4" stroke-linecap="round"/>
      <path d="M26 82H110" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="154" cy="34" r="9" fill="#16A35A"/>
    </g>

    <!-- search docs -->
    <g transform="translate(56 300)">
      <rect x="0" y="0" width="164" height="120" rx="18" fill="#FFFFFF" stroke="#123D78" stroke-width="4"/>
      <path d="M28 34H118" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 58H96" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 82H130" stroke="#123D78" stroke-width="4" stroke-linecap="round"/>
      <circle cx="122" cy="82" r="16" fill="none" stroke="#16A35A" stroke-width="5"/>
      <path d="M133 93L148 108" stroke="#16A35A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- circuit links -->
    <g opacity="0.95">
      <path d="M305 136C356 118 392 110 438 102" stroke="#123D78" stroke-width="3" stroke-linecap="round"/>
      <path d="M305 156C356 170 389 182 436 202" stroke="#123D78" stroke-width="3" stroke-linecap="round"/>
      <path d="M236 164C206 194 186 216 156 248" stroke="#123D78" stroke-width="3" stroke-linecap="round"/>
      <path d="M240 238C210 262 188 278 158 294" stroke="#123D78" stroke-width="3" stroke-linecap="round"/>
      <path d="M336 252C368 274 398 290 438 308" stroke="#123D78" stroke-width="3" stroke-linecap="round"/>
      <circle cx="438" cy="102" r="6" fill="#16A35A"/>
      <circle cx="436" cy="202" r="6" fill="#16A35A"/>
      <circle cx="156" cy="248" r="6" fill="#16A35A"/>
      <circle cx="158" cy="294" r="6" fill="#16A35A"/>
      <circle cx="438" cy="308" r="6" fill="#16A35A"/>
    </g>
  </g>

  <!-- bottom scene strip -->
  <g transform="translate(150 720)">
    <text class="small" x="0" y="0">常见场景</text>
    <g transform="translate(0 24)">
      <rect x="0" y="0" width="260" height="68" rx="22" fill="#FFFFFF" stroke="#D9E6F1"/>
      <text class="small" x="28" y="29">小红书助手</text>
      <text class="muted" x="28" y="53">选题・正文・标签</text>
      <circle cx="218" cy="34" r="14" fill="#E8F7EE"/>
      <path d="M210 34H226" stroke="#16A35A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(280 24)">
      <rect x="0" y="0" width="260" height="68" rx="22" fill="#FFFFFF" stroke="#D9E6F1"/>
      <text class="small" x="28" y="29">公众号助手</text>
      <text class="muted" x="28" y="53">选题・推文・排版</text>
      <circle cx="218" cy="34" r="14" fill="#E8F7EE"/>
      <path d="M210 34H226" stroke="#16A35A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(560 24)">
      <rect x="0" y="0" width="240" height="68" rx="22" fill="#FFFFFF" stroke="#D9E6F1"/>
      <text class="small" x="24" y="29">PPT 助手</text>
      <text class="muted" x="24" y="53">大纲・要点・结构</text>
      <circle cx="194" cy="34" r="14" fill="#E8F7EE"/>
      <path d="M186 34H202" stroke="#16A35A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(820 24)">
