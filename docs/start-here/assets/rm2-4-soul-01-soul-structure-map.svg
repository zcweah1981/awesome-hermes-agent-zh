<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="SOUL.md、/personality、AGENTS.md 分层结构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="100%" stop-color="#0b1e2f"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163a63"/>
      <stop offset="100%" stop-color="#1c4d84"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a5a1d"/>
      <stop offset="100%" stop-color="#9b7421"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e2433"/>
      <stop offset="100%" stop-color="#8a3041"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 46px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f2f7ff; }
      .subtitle { font: 500 22px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #aab8c8; }
      .label { font: 800 28px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .body { font: 500 21px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e9f1fa; }
      .small { font: 500 18px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #d7e0ea; }
      .callout { font: 700 20px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #eaffef; }
      .chip { font: 700 18px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0d1a25; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="40" y="40" width="1520" height="820" rx="28" fill="none" stroke="#274057" stroke-width="2" opacity="0.7"/>

  <text x="88" y="108" class="chip">ADVANCED USAGE · SOUL</text>
  <text x="88" y="168" class="title">SOUL.md 管长期默认人格，别和 /personality、AGENTS.md 混在一起</text>
  <text x="88" y="212" class="subtitle">一句话记住：SOUL.md = 长期默认人格；/personality = 会话内临时覆盖；AGENTS.md = 项目/仓库规则</text>

  <rect x="1128" y="84" width="360" height="86" rx="20" fill="#1f7a51" opacity="0.98"/>
  <text x="1160" y="122" class="callout">这张图只证明一件事</text>
  <text x="1160" y="150" class="callout">作用范围不同，别混用</text>

  <line x1="800" y1="248" x2="800" y2="724" stroke="#34d7c1" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="800" cy="340" r="13" fill="#34d7c1"/>
  <circle cx="800" cy="482" r="13" fill="#34d7c1"/>
  <circle cx="800" cy="624" r="13" fill="#34d7c1"/>

  <line x1="800" y1="340" x2="520" y2="340" stroke="#34d7c1" stroke-width="4" opacity="0.7"/>
  <line x1="800" y1="482" x2="1080" y2="482" stroke="#34d7c1" stroke-width="4" opacity="0.7"/>
  <line x1="800" y1="624" x2="520" y2="624" stroke="#34d7c1" stroke-width="4" opacity="0.7"/>

  <rect x="170" y="258" width="350" height="170" rx="28" fill="url(#card1)" filter="url(#shadow)"/>
  <text x="206" y="306" class="label">SOUL.md</text>
  <text x="206" y="347" class="body">长期默认人格</text>
  <text x="206" y="382" class="small">语气 / 口吻 / 行为底色</text>
  <text x="206" y="414" class="small">~/.hermes/SOUL.md 或</text>
  <text x="206" y="442" class="small">$HERMES_HOME/SOUL.md</text>

  <rect x="1080" y="400" width="350" height="170" rx="28" fill="url(#card2)" filter="url(#shadow)"/>
  <text x="1116" y="448" class="label">/personality</text>
  <text x="1116" y="489" class="body">会话内临时覆盖</text>
  <text x="1116" y="524" class="small">这次会话有效</text>
  <text x="1116" y="556" class="small">快速试风格</text>
  <text x="1116" y="588" class="small">不是长期默认设定</text>

  <rect x="170" y="542" width="350" height="170" rx="28" fill="url(#card3)" filter="url(#shadow)"/>
  <text x="206" y="590" class="label">AGENTS.md</text>
  <text x="206" y="631" class="body">项目 / 仓库规则</text>
  <text x="206" y="666" class="small">目录结构与约定</text>
  <text x="206" y="698" class="small">任务边界与执行规则</text>
  <text x="206" y="730" class="small">不是长期人格文件</text>

  <rect x="340" y="764" width="920" height="72" rx="22" fill="#102335" stroke="#2f5b78" stroke-width="2"/>
  <text x="382" y="810" class="body">一句话：SOUL.md = 你想让 Hermes 长期像谁；/personality = 这次临时切一下；AGENTS.md = 进到某个项目后要守什么规矩。</text>
</svg>
