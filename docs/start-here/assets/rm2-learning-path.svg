<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131B"/>
      <stop offset="1" stop-color="#0B1D28"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102733"/>
      <stop offset="1" stop-color="#0B1821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2EE6A6"/>
      <stop offset="1" stop-color="#1ABF86"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.12" stroke="#7FFFD4">
    <path d="M0 90H1600"/>
    <path d="M0 210H1600"/>
    <path d="M0 330H1600"/>
    <path d="M0 450H1600"/>
    <path d="M0 570H1600"/>
    <path d="M0 690H1600"/>
    <path d="M0 810H1600"/>
    <path d="M100 0V900"/>
    <path d="M300 0V900"/>
    <path d="M500 0V900"/>
    <path d="M700 0V900"/>
    <path d="M900 0V900"/>
    <path d="M1100 0V900"/>
    <path d="M1300 0V900"/>
    <path d="M1500 0V900"/>
  </g>

  <text x="120" y="130" fill="#E8FFF7" font-size="54" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">Hermes 学习路径</text>
  <text x="120" y="182" fill="#99C8BC" font-size="26" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">从第一次跑通，到真正搭起自己的 AI 工作流</text>

  <g filter="url(#glow)">
    <circle cx="250" cy="610" r="8" fill="#2EE6A6"/>
    <circle cx="610" cy="610" r="8" fill="#2EE6A6"/>
    <circle cx="970" cy="610" r="8" fill="#2EE6A6"/>
    <circle cx="1330" cy="610" r="8" fill="#2EE6A6"/>
    <path d="M250 610H1330" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="120" y="300" width="260" height="230" rx="28" fill="url(#card)" stroke="#2EE6A6" stroke-opacity="0.5"/>
    <rect x="120" y="300" width="260" height="12" rx="6" fill="url(#accent)"/>
    <text x="150" y="365" fill="#2EE6A6" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">第一阶段</text>
    <text x="150" y="420" fill="#F2FFF9" font-size="38" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">先跑起来</text>
    <text x="150" y="472" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">准备环境 → 进入终端</text>
    <text x="150" y="510" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">安装 Hermes → 第一次互动</text>
  </g>

  <g>
    <rect x="480" y="300" width="260" height="230" rx="28" fill="url(#card)" stroke="#2EE6A6" stroke-opacity="0.35"/>
    <rect x="480" y="300" width="260" height="12" rx="6" fill="url(#accent)"/>
    <text x="510" y="365" fill="#2EE6A6" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">第二阶段</text>
    <text x="510" y="420" fill="#F2FFF9" font-size="38" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">开始上手</text>
    <text x="510" y="472" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">日常使用、会话管理</text>
    <text x="510" y="510" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">常用 Skills、消息平台</text>
  </g>

  <g>
    <rect x="840" y="300" width="260" height="230" rx="28" fill="url(#card)" stroke="#2EE6A6" stroke-opacity="0.35"/>
    <rect x="840" y="300" width="260" height="12" rx="6" fill="url(#accent)"/>
    <text x="870" y="365" fill="#2EE6A6" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">第三阶段</text>
    <text x="870" y="420" fill="#F2FFF9" font-size="38" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">玩出花样</text>
    <text x="870" y="472" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">人格、记忆、模型</text>
    <text x="870" y="510" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">工具开关、终端主题</text>
  </g>

  <g>
    <rect x="1200" y="300" width="260" height="230" rx="28" fill="url(#card)" stroke="#2EE6A6" stroke-opacity="0.35"/>
    <rect x="1200" y="300" width="260" height="12" rx="6" fill="url(#accent)"/>
    <text x="1230" y="365" fill="#2EE6A6" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">第四阶段</text>
    <text x="1230" y="420" fill="#F2FFF9" font-size="38" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">自己造东西</text>
    <text x="1230" y="472" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">Profiles、外部记忆</text>
    <text x="1230" y="510" fill="#B7D6CC" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">MCP、API、自动化、IDE</text>
  </g>

  <g fill="#9FE8D0" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="194" y="655">跑通</text>
    <text x="548" y="655">上手</text>
    <text x="904" y="655">进阶</text>
    <text x="1264" y="655">系统化</text>
  </g>

  <text x="120" y="790" fill="#82B5A6" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">建议阅读顺序：先跑起来 → 开始上手 → 玩出花样 → 自己造东西</text>
</svg>