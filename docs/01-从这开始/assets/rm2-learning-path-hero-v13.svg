  <text x="800" y="730" text-anchor="middle" fill="#A3C7BA" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">四个阶段，分别解决：跑通、上手、定制、构建。</text>
</svg>