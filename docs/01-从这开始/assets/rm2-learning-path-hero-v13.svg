  <g>
    <text x="1258" y="506" text-anchor="middle" fill="#F7FFF9" font-size="36" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">04-自己造东西</text>
    <path d="M1154 536H1362" stroke="#31525C" stroke-width="2.5"/>
    <text x="1258" y="580" text-anchor="middle" fill="#D0DFE1" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">Profiles、MCP、API</text>
    <text x="1258" y="618" text-anchor="middle" fill="#A3C7BA" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">自动化与 IDE</text>
