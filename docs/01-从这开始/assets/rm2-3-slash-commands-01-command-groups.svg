<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="920" rx="36" fill="#F7FAFC"/>
<text x="120" y="120" fill="#183B5B" font-size="48" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-weight="700">第一批最常用的 6 个斜杠命令</text>
<rect x="120" y="154" width="260" height="6" rx="3" fill="#37B26C"/>
<text x="120" y="210" fill="#40617F" font-size="28" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">第一次02-开始上手时，不需要把全部命令记完，先抓这 6 个就够。</text>

<g>
  <rect x="120" y="280" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="154" y="348" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/help</text>
  <text x="154" y="396" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">先看可用命令和入口</text>
</g>
<g>
  <rect x="600" y="280" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="634" y="348" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/tools</text>
  <text x="634" y="396" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">看当前工具开关状态</text>
</g>
<g>
  <rect x="1080" y="280" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="1114" y="348" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/model</text>
  <text x="1114" y="396" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">切换或确认当前模型</text>
</g>
<g>
  <rect x="120" y="500" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="154" y="568" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/save</text>
  <text x="154" y="616" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">保存当前会话</text>
</g>
<g>
  <rect x="600" y="500" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="634" y="568" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/title</text>
  <text x="634" y="616" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">给会话一个好找的标题</text>
</g>
<g>
  <rect x="1080" y="500" width="400" height="160" rx="24" fill="#FFFFFF" stroke="#183B5B" stroke-width="3"/>
  <text x="1114" y="568" fill="#183B5B" font-size="36" font-family="DejaVu Sans Mono, monospace" font-weight="700">/history</text>
  <text x="1114" y="616" fill="#40617F" font-size="26" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">回看以前的会话记录</text>
</g>

<rect x="120" y="730" width="1360" height="90" rx="24" fill="#ECF8F0" stroke="#37B26C" stroke-width="3"/>
<text x="160" y="785" fill="#183B5B" font-size="30" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-weight="700">建议顺序：</text>
<text x="348" y="785" fill="#183B5B" font-size="28" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif">先 /help 看入口，再用 /save、/title、/history 管会话；/tools 和 /model 用来确认当前工作状态。</text>
</svg>