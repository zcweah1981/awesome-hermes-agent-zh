<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="100%" stop-color="#0b1f2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66ff99"/>
      <stop offset="100%" stop-color="#49d17a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: 'WenQuanYi Zen Hei', 'DejaVu Sans', sans-serif; font-weight: 700; fill: #f5fbff; }
      .sub { font-family: 'WenQuanYi Zen Hei', 'DejaVu Sans', sans-serif; fill: #9bb4c6; }
      .stepno { font-family: 'DejaVu Sans', sans-serif; font-weight: 700; fill: #08131d; }
      .stepTitle { font-family: 'WenQuanYi Zen Hei', 'DejaVu Sans', sans-serif; font-weight: 700; fill: #f4fff7; }
      .stepBody { font-family: 'WenQuanYi Zen Hei', 'DejaVu Sans', sans-serif; fill: #d6eef2; }
      .card { fill: #0b1b29; stroke: #2f566b; stroke-width: 2; }
      .pill { fill: #0f2736; stroke: #2c5166; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="none" stroke="#173247" stroke-width="2" opacity="0.9"/>

  <text x="92" y="120" class="sub" font-size="24" letter-spacing="2">ADVANCED USAGE</text>
  <text x="92" y="170" class="title" font-size="50">
    <tspan x="92" dy="0">把一个会用的 Hermes，</tspan>
    <tspan x="92" dy="62">升级成更像你的单助手</tspan>
  </text>
  <text x="92" y="280" class="sub" font-size="28">只做 5 步：人格 → 记忆 → 模型 → 工具 → 外观</text>

  <rect x="92" y="324" width="470" height="64" rx="18" class="pill"/>
  <text x="126" y="365" class="stepBody" font-size="24">进入前提：你已经会稳定使用 Hermes</text>

  <rect x="1150" y="98" width="360" height="92" rx="22" fill="#0f2937" stroke="#2f566b" stroke-width="2"/>
  <text x="1330" y="132" text-anchor="middle" class="sub" font-size="22">阶段目标</text>
  <text x="1330" y="166" text-anchor="middle" class="title" font-size="28">更像你、更懂你、更顺手</text>

  <line x1="120" y1="470" x2="1480" y2="470" stroke="url(#line)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <g transform="translate(95,510)">
    <rect x="0" y="0" width="270" height="178" rx="22" class="card"/>
    <circle cx="42" cy="42" r="28" fill="#66ff99" filter="url(#glow)"/>
    <text x="42" y="52" text-anchor="middle" class="stepno" font-size="24">1</text>
    <text x="24" y="98" class="stepTitle" font-size="28">先定人格</text>
    <text x="24" y="136" class="stepBody" font-size="22">SOUL.md</text>
    <text x="24" y="164" class="stepBody" font-size="22">长期语气与行为底色</text>
  </g>

  <g transform="translate(390,510)">
    <rect x="0" y="0" width="270" height="178" rx="22" class="card"/>
    <circle cx="42" cy="42" r="28" fill="#66ff99" filter="url(#glow)"/>
    <text x="42" y="52" text-anchor="middle" class="stepno" font-size="24">2</text>
    <text x="24" y="98" class="stepTitle" font-size="28">再定记忆</text>
    <text x="24" y="136" class="stepBody" font-size="22">USER.md / MEMORY.md</text>
    <text x="24" y="164" class="stepBody" font-size="22">只留跨会话还值钱的事</text>
  </g>

  <g transform="translate(685,510)">
    <rect x="0" y="0" width="270" height="178" rx="22" class="card"/>
    <circle cx="42" cy="42" r="28" fill="#66ff99" filter="url(#glow)"/>
    <text x="42" y="52" text-anchor="middle" class="stepno" font-size="24">3</text>
    <text x="24" y="98" class="stepTitle" font-size="28">再选模型</text>
    <text x="24" y="136" class="stepBody" font-size="22">provider / model / endpoint</text>
    <text x="24" y="164" class="stepBody" font-size="22">按成本、速度、稳定性重配</text>
  </g>

  <g transform="translate(980,510)">
    <rect x="0" y="0" width="270" height="178" rx="22" class="card"/>
    <circle cx="42" cy="42" r="28" fill="#66ff99" filter="url(#glow)"/>
    <text x="42" y="52" text-anchor="middle" class="stepno" font-size="24">4</text>
    <text x="24" y="98" class="stepTitle" font-size="28">再整工具</text>
    <text x="24" y="136" class="stepBody" font-size="22">toolsets / workflow</text>
    <text x="24" y="164" class="stepBody" font-size="22">把常用工具组合调顺</text>
  </g>

  <g transform="translate(1275,510)">
    <rect x="0" y="0" width="270" height="178" rx="22" class="card"/>
    <circle cx="42" cy="42" r="28" fill="#66ff99" filter="url(#glow)"/>
    <text x="42" y="52" text-anchor="middle" class="stepno" font-size="24">5</text>
    <text x="24" y="98" class="stepTitle" font-size="28">最后调外观</text>
    <text x="24" y="136" class="stepBody" font-size="22">skins / themes</text>
    <text x="24" y="164" class="stepBody" font-size="22">把界面收尾成舒服的样子</text>
  </g>

  <rect x="92" y="770" width="1416" height="64" rx="18" fill="#0f2736" stroke="#2c5166" stroke-width="2"/>
  <text x="800" y="809" text-anchor="middle" class="stepBody" font-size="24">本阶段先不做：多助手 / Profiles / MCP / API Server</text>
</svg>