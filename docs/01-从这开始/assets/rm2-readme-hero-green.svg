<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06161A"/>
      <stop offset="0.52" stop-color="#0A2420"/>
      <stop offset="1" stop-color="#081D2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="120" x2="1380" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43E19F"/>
      <stop offset="0.45" stop-color="#36C8A8"/>
      <stop offset="1" stop-color="#4B8CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 54px 'WenQuanYi Zen Hei','WenQuanYi Zen Hei Sharp','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #F3FFF7; letter-spacing: 0.5px; }
      .subtitle { font: 500 22px 'WenQuanYi Zen Hei','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #D0F7E4; opacity: 0.95; }
      .body { font: 500 18px 'WenQuanYi Zen Hei','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #C7E9DC; }
      .cardTitle { font: 700 24px 'WenQuanYi Zen Hei','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #F5FFFA; }
      .cardBody { font: 500 16px 'WenQuanYi Zen Hei','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #CFE5DC; }
      .tiny { font: 600 15px 'WenQuanYi Zen Hei','Inter','PingFang SC','Microsoft YaHei',sans-serif; fill: #8FE6B8; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>

  <g opacity="0.20">
    <path d="M-40 120H1640" stroke="#42DCA0" stroke-width="1"/>
    <path d="M-40 220H1640" stroke="#2F7DF2" stroke-width="1"/>
    <path d="M-40 320H1640" stroke="#42DCA0" stroke-width="1"/>
    <path d="M-40 420H1640" stroke="#2F7DF2" stroke-width="1"/>
    <path d="M-40 520H1640" stroke="#42DCA0" stroke-width="1"/>
    <path d="M-40 620H1640" stroke="#2F7DF2" stroke-width="1"/>
    <path d="M140 0V720" stroke="#42DCA0" stroke-width="1"/>
    <path d="M420 0V720" stroke="#2F7DF2" stroke-width="1"/>
    <path d="M700 0V720" stroke="#42DCA0" stroke-width="1"/>
    <path d="M980 0V720" stroke="#2F7DF2" stroke-width="1"/>
    <path d="M1260 0V720" stroke="#42DCA0" stroke-width="1"/>
  </g>

  <circle cx="1320" cy="120" r="150" fill="#43E19F" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1480" cy="180" r="78" fill="#4B8CFF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="210" cy="610" r="120" fill="#4B8CFF" opacity="0.09" filter="url(#glow)"/>

  <rect x="76" y="58" width="1448" height="604" rx="34" fill="#071A20" fill-opacity="0.55" stroke="url(#accent)" stroke-width="1.5" filter="url(#shadow)"/>

  <g transform="translate(120 120)">
    <text class="tiny" x="0" y="0">HERMES AGENT 中文站</text>
    <text class="title" x="0" y="74">一套完整的 AI Agent 落地路径</text>
    <text class="subtitle" x="0" y="122">从先跑通，到会定制，再到能集成与自动化</text>

    <g transform="translate(0 164)">
      <rect x="0" y="0" width="520" height="160" rx="24" fill="#0B2524" stroke="#2BD8A0" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M34 34H86" stroke="#43E19F" stroke-width="5" stroke-linecap="round"/>
      <circle cx="34" cy="34" r="7" fill="#43E19F"/>
      <text class="cardTitle" x="34" y="78">你会在这里得到什么</text>
      <text class="cardBody" x="34" y="116">• 先把 Hermes 真正跑起来</text>
      <text class="cardBody" x="34" y="146">• 再把日常使用和配置理顺</text>
      <text class="cardBody" x="288" y="116">• 然后定制模型、记忆、工具和外观</text>
      <text class="cardBody" x="288" y="146">• 最后进入多助手、MCP、API 与自动化</text>
    </g>
  </g>

  <g transform="translate(730 130)">
    <text class="tiny" x="0" y="0">四大入口</text>

    <g transform="translate(0 34)">
      <rect x="0" y="0" width="340" height="150" rx="24" fill="#0A212A" stroke="#43E19F" stroke-opacity="0.55" stroke-width="1.4"/>
      <text class="cardTitle" x="24" y="42">01-从这开始</text>
      <text class="cardBody" x="24" y="82">安装 / 首次体验 / 上手</text>
      <text class="cardBody" x="24" y="112">适合第一次接触 Hermes 的人</text>
      <path d="M24 130H106" stroke="#43E19F" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(364 34)">
      <rect x="0" y="0" width="340" height="150" rx="24" fill="#0A2320" stroke="#36C8A8" stroke-opacity="0.55" stroke-width="1.4"/>
      <text class="cardTitle" x="24" y="42">03-国内落地</text>
      <text class="cardBody" x="24" y="82">模型 / Provider / 部署 / 成本</text>
      <text class="cardBody" x="24" y="112">适合先想清楚怎么用的人</text>
      <path d="M24 130H106" stroke="#36C8A8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(0 210)">
      <rect x="0" y="0" width="340" height="150" rx="24" fill="#0A202D" stroke="#4B8CFF" stroke-opacity="0.55" stroke-width="1.4"/>
      <text class="cardTitle" x="24" y="42">04-从 OpenClaw 过来</text>
      <text class="cardBody" x="24" y="82">对比 / 判断 / 结合使用 / 迁移</text>
      <text class="cardBody" x="24" y="112">适合已有工作流的人</text>
      <path d="M24 130H106" stroke="#4B8CFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(364 210)">
      <rect x="0" y="0" width="340" height="150" rx="24" fill="#0B1F24" stroke="#8FE6B8" stroke-opacity="0.55" stroke-width="1.4"/>
      <text class="cardTitle" x="24" y="42">文档总览 / 治理说明</text>
      <text class="cardBody" x="24" y="82">全站地图 / 结构 / 来源映射</text>
      <text class="cardBody" x="24" y="112">适合想快速找到入口的人</text>
      <path d="M24 130H106" stroke="#8FE6B8" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(120 610)">
    <text class="body" x="0" y="0">四个阶段，分别解决：跑通、上手、定制、构建。</text>
  </g>
</svg>
