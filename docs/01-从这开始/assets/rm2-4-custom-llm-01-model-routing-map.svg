<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="模型接线主路径结构图：先用官方主路，再考虑 custom endpoint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111d"/>
      <stop offset="100%" stop-color="#0c2232"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67f2a0"/>
      <stop offset="100%" stop-color="#45c67b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { font: 700 20px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #7ef0bf; letter-spacing: 2px; }
      .title { font: 700 48px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #f4fbff; }
      .subtitle { font: 500 24px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #b8c9d6; }
      .h { font: 700 28px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #f4fff8; }
      .b { font: 500 22px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #d7e7ef; }
      .s { font: 500 18px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #b6cad7; }
      .chip { font: 700 18px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; fill: #08131d; }
      .card { fill: #0c1d2b; stroke: #2b5368; stroke-width: 2; }
      .card2 { fill: #0f2535; stroke: #2f6a7c; stroke-width: 2; }
      .good { fill: #66f0a0; }
      .note { fill: #0f2736; stroke: #355f72; stroke-width: 2; }
      .mono { font: 700 19px 'DejaVu Sans Mono', 'Menlo', monospace; fill: #67f2a0; }
      .link { stroke: url(#accent); stroke-width: 8; stroke-linecap: round; filter: url(#glow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="none" stroke="#1b3447" stroke-width="2" opacity="0.9"/>

  <text x="88" y="108" class="eyebrow">ADVANCED USAGE · 模型层</text>
  <text x="88" y="170" class="title">先用官方主路，再考虑自定义入口</text>
  <text x="88" y="214" class="subtitle">优先走 hermes model / 官方 provider；只有明确需要统一网关或自托管时，才进入 custom endpoint。</text>

  <rect x="1128" y="84" width="360" height="98" rx="22" fill="#11382d" stroke="#42d283" stroke-width="2"/>
  <text x="1308" y="123" text-anchor="middle" class="h" font-size="24">默认优先级</text>
  <text x="1308" y="155" text-anchor="middle" class="b" font-size="20">官方 provider → 备用 provider → custom endpoint</text>

  <line x1="170" y1="314" x2="1430" y2="314" class="link"/>
  <circle cx="235" cy="314" r="14" fill="#67f2a0" filter="url(#glow)"/>
  <circle cx="800" cy="314" r="14" fill="#67f2a0" filter="url(#glow)"/>
  <circle cx="1360" cy="314" r="14" fill="#67f2a0" filter="url(#glow)"/>

  <g transform="translate(80,354)">
    <rect x="0" y="0" width="430" height="240" rx="28" class="card"/>
    <rect x="26" y="24" width="146" height="34" rx="17" fill="#67f2a0"/>
    <text x="99" y="47" text-anchor="middle" class="chip">1 / 官方主路</text>
    <text x="28" y="102" class="h">hermes model</text>
    <text x="28" y="144" class="b">设置 provider / model</text>
    <text x="28" y="178" class="b">写入 config.yaml</text>
    <text x="28" y="212" class="s">适合大多数人先跑通</text>
  </g>

  <g transform="translate(585,354)">
    <rect x="0" y="0" width="430" height="240" rx="28" class="card2"/>
    <rect x="26" y="24" width="154" height="34" rx="17" fill="#67f2a0"/>
    <text x="103" y="47" text-anchor="middle" class="chip">2 / 稳定性补强</text>
    <text x="28" y="102" class="h">credential pools</text>
    <text x="28" y="144" class="b">同一 provider 多 key 轮换</text>
    <text x="28" y="178" class="b">主要解决 429 / 限流</text>
    <text x="28" y="212" class="s">不改模型路线，只补同路冗余</text>
  </g>

  <g transform="translate(1090,354)">
    <rect x="0" y="0" width="430" height="240" rx="28" class="card"/>
    <rect x="26" y="24" width="146" height="34" rx="17" fill="#67f2a0"/>
    <text x="99" y="47" text-anchor="middle" class="chip">3 / 下游分支</text>
    <text x="28" y="102" class="h">fallback_model</text>
    <text x="28" y="144" class="b">主路挂了，切备用 provider</text>
    <text x="28" y="178" class="b">custom endpoint = 更下游入口</text>
    <text x="28" y="212" class="s">仅在你明确要接网关 / 自托管时用</text>
  </g>

  <line x1="800" y1="600" x2="800" y2="690" class="link"/>
  <path d="M786 676L800 702L814 676" class="link" fill="none"/>

  <g transform="translate(120,702)">
    <rect x="0" y="0" width="520" height="114" rx="22" class="note"/>
    <text x="26" y="40" class="h" font-size="24">什么时候才走 custom endpoint</text>
    <text x="26" y="76" class="b" font-size="20">本地模型 / vLLM / Ollama / LM Studio / 企业统一网关</text>
  </g>

  <g transform="translate(676,702)">
    <rect x="0" y="0" width="804" height="114" rx="22" class="note"/>
    <text x="26" y="40" class="h" font-size="24">最短验收顺序</text>
    <text x="26" y="76" class="b" font-size="20">先看 config.yaml 写没写进去 → 再确认一条最小 query 能正常回复 → 再谈优化</text>
  </g>

  <text x="88" y="856" class="mono">记住：多密钥轮换 解决“同一路不稳”；fallback_model 解决“主路挂了”。</text>
</svg>
