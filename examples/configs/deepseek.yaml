# 复制此内容到你的 ~/.hermes/config.yaml 中

api_keys:
  deepseek: "sk-your-deepseek-api-key"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models:
        - "deepseek-chat"
        - "deepseek-coder"

display:
  skin: "default"