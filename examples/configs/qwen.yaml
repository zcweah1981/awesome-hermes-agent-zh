# 复制此内容到你的 ~/.hermes/config.yaml 中

api_keys:
  qwen: "sk-your-qwen-api-key"

providers:
  custom:
    - name: "qwen"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key_env: "qwen"
      models:
        - "qwen-turbo"
        - "qwen-plus"
        - "qwen-max"
        - "qwen-coder-plus"

display:
  skin: "default"