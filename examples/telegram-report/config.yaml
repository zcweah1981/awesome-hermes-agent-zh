api_keys:
  deepseek: "${DEEPSEEK_API_KEY:-your-key}"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models: ["deepseek-chat"]

display:
  skin: "default"

commands:
  - "/model custom/deepseek-chat"
  - "/system_prompt ./system_prompt.txt"
  - "/save skill report-template ./report_template.md"

# 将 deliver 的示例目标替换为你的 Telegram chat id
cron:
  default_deliver: "telegram:-1001234567890"
