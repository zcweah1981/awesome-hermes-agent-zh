api_keys:
  deepseek: "${DEEPSEEK_API_KEY:-your-key}"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models: ["deepseek-chat"]

display:
  skin: "default"

commands:
  - "/model custom/deepseek-chat"
  # 注册自定义 Webhook 工具
  - "/skill add send_feishu python ./send_webhook.py '{{content}}'"
  - "/system_prompt ./system_prompt.txt"