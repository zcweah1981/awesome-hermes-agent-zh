api_keys:
  deepseek: "${DEEPSEEK_API_KEY:-your-key}"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models: ["deepseek-chat"]

display:
  skin: "default"

commands:
  - "/model custom/deepseek-chat"
  - "/system_prompt ./system_prompt.txt"
