# ============================================================
# 同步决策类型说明
# ============================================================

sync_decision_types:
  - id: baseline_established
    description: 初始基线建立，无需同步
  - id: no_action_needed
    description: 版本更新但无影响内容仓的变更
  - id: sync_required
    description: 需要同步——存在影响用户操作的变更
  - id: sync_in_progress
    description: 同步进行中
  - id: sync_completed
    description: 同步完成，内容仓已更新
  - id: review_blocked
    description: 同步被阻塞——需 PM/Content 审核
  - id: deferred
    description: 延后同步——变更影响低或需要更多官方信息

