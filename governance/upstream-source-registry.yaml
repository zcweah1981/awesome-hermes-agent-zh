change_policy:
  record_on_doc_update:
  - source_id
  - source_url
  - checked_at
  - affected_doc
  - change_type
  forbidden:
  - raw credentials
  - private tokens
  - internal dispatch logs
  - unverified provider claims
  - pricing copied without checked date
