api_keys:
  deepseek: "${DEEPSEEK_API_KEY:-your-key}"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models:
        - "deepseek-chat"
        - "deepseek-coder"

display:
  skin: "default"

commands:
  - "/model custom/deepseek-chat"
  - "/system_prompt ./system_prompt.txt"
  # 注册团队别名
  - "/acp_alias add coder hermes --acp --model custom/deepseek-coder --system_prompt ./coder_system.txt"
  - "/acp_alias add reviewer hermes --acp --model custom/deepseek-chat --system_prompt ./reviewer_system.txt"