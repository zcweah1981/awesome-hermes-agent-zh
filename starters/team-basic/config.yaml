api_keys:
  deepseek: "${DEEPSEEK_API_KEY:-your-key}"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models:
        - "deepseek-chat"
        - "deepseek-coder"

display:
  skin: "default"

commands:
  - "/model custom/deepseek-chat"
  - "/system_prompt ./system_prompt.txt"
  # 定义 ACP 代理别名，方便主节点调用
  - "/acp_alias add coder hermes --acp --model custom/deepseek-coder --system_prompt ./coder_system.txt"
  - "/acp_alias add qa hermes --acp --model custom/deepseek-chat --system_prompt ./qa_system.txt"