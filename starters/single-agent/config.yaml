api_keys:
  deepseek: "YOUR_DEEPSEEK_API_KEY"

providers:
  custom:
    - name: "deepseek"
      base_url: "https://api.deepseek.com/v1"
      api_key_env: "deepseek"
      models:
        - "deepseek-chat"

# 默认设置
model: "custom/deepseek-chat"
system_prompt_file: "system_prompt.txt"
quiet_mode: false
