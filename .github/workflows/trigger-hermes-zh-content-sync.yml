# awesome-hermes-agent-zh — manually trigger hermes-zh content sync
# Content validation is performed once by the Required CI Gate before merge.
name: trigger-hermes-zh-content-sync

on:
  workflow_dispatch:
    inputs:
      content_sha:
        description: "Full 40-character awesome-hermes-agent-zh commit SHA to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trigger-hermes-zh-content-sync
  cancel-in-progress: true

jobs:
  validate-and-dispatch:
    name: Dispatch validated content SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch hermes-zh site content sync
        env:
          SITE_REPO_DISPATCH_TOKEN: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
          TARGET_REPO: zcweah1981/hermes-zh
          DISPATCH_EVENT_TYPE: content-updated
          CONTENT_SHA: ${{ inputs.content_sha }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_REPO_DISPATCH_TOKEN:-}" ]; then
            echo "SITE_REPO_DISPATCH_TOKEN is not configured; cannot trigger ${TARGET_REPO} repository_dispatch." >&2
            exit 1
          fi
          echo "::add-mask::${SITE_REPO_DISPATCH_TOKEN}"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sha = os.environ['CONTENT_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit(f'CONTENT_SHA must be a full 40-character lowercase git SHA, got: {sha!r}')

          payload = {
              'event_type': os.environ['DISPATCH_EVENT_TYPE'],
              'client_payload': {
                  'content_repo': os.environ['GITHUB_REPOSITORY'],
                  'content_ref': 'main',
                  'content_sha': sha,
                  'actor': os.environ['GITHUB_ACTOR'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'source_workflow_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          }
          if payload['event_type'] != 'content-updated':
              raise SystemExit('repository_dispatch event_type must be content-updated')
          Path('dispatch-payload.json').write_text(json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          api_base="https://api.github.com"
          dispatch_path="/repos/${TARGET_REPO}/dispatches"

          curl -sS -fL --retry 3 --retry-delay 2 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_REPO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_base}${dispatch_path}" \
            --data-binary @dispatch-payload.json

          {
            echo "## hermes-zh content sync dispatch"
            echo "- target_repo: ${TARGET_REPO}"
            echo "- event_type: ${DISPATCH_EVENT_TYPE}"
            echo "- content_sha: ${CONTENT_SHA}"
            echo "- content_ref: main"
          } >> "$GITHUB_STEP_SUMMARY"
