# awesome-hermes-agent-zh — manually trigger hermes-zh content sync
# Content validation is performed locally before the selected SHA is dispatched.
name: trigger-hermes-zh-content-sync

on:
  workflow_dispatch:
    inputs:
      content_sha:
        description: "Full 40-character awesome-hermes-agent-zh commit SHA to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trigger-hermes-zh-content-sync
  cancel-in-progress: true

jobs:
  validate-and-dispatch:
    name: Dispatch validated content SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch hermes-zh site content sync
        env:
          SITE_REPO_DISPATCH_TOKEN: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
          TARGET_REPO: zcweah1981/hermes-zh
          TARGET_WORKFLOW: content-auto-sync.yml
          CONTENT_SHA: ${{ inputs.content_sha }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_REPO_DISPATCH_TOKEN:-}" ]; then
            echo "SITE_REPO_DISPATCH_TOKEN is not configured; cannot trigger ${TARGET_REPO}/${TARGET_WORKFLOW}." >&2
            exit 1
          fi
          echo "::add-mask::${SITE_REPO_DISPATCH_TOKEN}"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sha = os.environ['CONTENT_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit(f'CONTENT_SHA must be a full 40-character lowercase git SHA, got: {sha!r}')

          payload = {
              'ref': 'main',
              'inputs': {
                  'content_repo': os.environ['GITHUB_REPOSITORY'],
                  'content_ref': 'main',
                  'content_sha': sha,
                  'source_actor': os.environ['GITHUB_ACTOR'],
              },
          }
          Path('workflow-dispatch-payload.json').write_text(
              json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

          api_base="https://api.github.com"
          dispatch_path="/repos/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches"

          curl -sS -fL --retry 3 --retry-delay 2 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_REPO_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_base}${dispatch_path}" \
            --data-binary @workflow-dispatch-payload.json

          {
            echo "## hermes-zh content sync workflow dispatch"
            echo "- target_repo: ${TARGET_REPO}"
            echo "- target_workflow: ${TARGET_WORKFLOW}"
            echo "- content_sha: ${CONTENT_SHA}"
            echo "- content_ref: main"
          } >> "$GITHUB_STEP_SUMMARY"
