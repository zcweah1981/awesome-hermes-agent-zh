# awesome-hermes-agent-zh — Link Check
# 检查 README / docs / governance / packs 中的外部链接、相对路径和锚点。
name: link-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每周一北京时间 09:20；UTC 为 01:20
    - cron: "20 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-file .lycheeignore
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --root-dir ${{ github.workspace }}
            --skip-missing
            --exclude-path 'docs/assets/render-.*\.html'
            './README.md'
            './docs/**/*.md'
            './governance/**/*.md'
            './governance/**/*.yml'
            './governance/**/*.yaml'
            './.github/**/*.yml'
            './.github/**/*.yaml'
            './**/*.html'
            './packs/**/*.md'
            './packs/**/*.yml'
            './packs/**/*.yaml'
          format: markdown
          output: lychee-report.md
          fail: true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Link Check"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Result: ${{ steps.lychee.outcome }}"
            echo ""
            if [ -f lychee-report.md ]; then
              cat lychee-report.md
            else
              echo "lychee-report.md was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: warn

      - name: Fail if Lychee failed
        if: steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Lychee link check failed. Full report:"
          if [ -f lychee-report.md ]; then
            cat lychee-report.md
          else
            echo "lychee-report.md was not generated."
          fi
          # Open a public issue with the report so we can inspect failures
          # without admin log access. Issue title encodes run id for easy dedupe.
          if [ -f lychee-report.md ]; then
            TITLE="link-check failed on run #${{ github.run_id }} (${{ github.sha }})"
            BODY=$(cat lychee-report.md)
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              || echo "Issue creation failed (non-fatal)"
          fi
          exit 1
