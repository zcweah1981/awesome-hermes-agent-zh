# awesome-hermes-agent-zh — Link Check
# 检查 README / docs / governance / packs 中的外部链接、相对路径和锚点。
name: link-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每周一北京时间 09:20；UTC 为 01:20
    - cron: "20 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-file .lycheeignore
            --max-concurrency 6
            --retry-wait-time 2
            --timeout 20
            --root-dir ${{ github.workspace }}
            --skip-missing
            --exclude-path 'docs/assets/render-.*\.html'
            './README.md'
            './docs/**/*.md'
            './governance/**/*.md'
            './governance/**/*.yml'
            './governance/**/*.yaml'
            './.github/**/*.yml'
            './.github/**/*.yaml'
            './**/*.html'
            './packs/**/*.md'
            './packs/**/*.yml'
            './packs/**/*.yaml'
          format: markdown
          output: lychee-report.md
          fail: true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Link Check"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Result: ${{ steps.lychee.outcome }}"
            echo ""
            if [ -f lychee-report.md ]; then
              cat lychee-report.md
            else
              echo "lychee-report.md was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: warn

      - name: Fail if Lychee failed
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "::error::Lychee link check failed. Full report:"
          if [ -f lychee-report.md ]; then
            cat lychee-report.md
          else
            echo "lychee-report.md was not generated."
          fi
          # Post the report as a commit comment via REST API so it's publicly visible
          # without admin log access. Requires contents:write on the default GITHUB_TOKEN.
          if [ -f lychee-report.md ] && [ -n "$GITHUB_TOKEN" ]; then
            REPO="${{ github.repository }}"
            SHA="${{ github.sha }}"
            PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'body': '``\\n' + open('lychee-report.md').read() + '\\n``'}))")
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/comments" \
              -d "${PAYLOAD}" \
              -o /tmp/comment_resp.json \
              && echo "Commit comment posted: $(python3 -c 'import json; print(json.load(open("/tmp/comment_resp.json")).get("html_url","??"))')" \
              || echo "Commit comment post failed (non-fatal; check permissions)"
          fi
          exit 1
