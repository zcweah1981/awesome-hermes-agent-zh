# awesome-hermes-agent-zh — Link Check
# 检查 README / docs / governance / packs 中的外部链接、相对路径和锚点。
name: link-check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        continue-on-error: true
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-file .lycheeignore
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --root-dir ${{ github.workspace }}
            --skip-missing
            --exclude-path 'docs/assets/render-.*\.html'
            './README.md'
            './docs/**/*.md'
            './governance/**/*.md'
            './governance/**/*.yml'
            './governance/**/*.yaml'
            './.github/**/*.yml'
            './.github/**/*.yaml'
            './**/*.html'
            './packs/**/*.md'
            './packs/**/*.yml'
            './packs/**/*.yaml'
          format: markdown
          output: lychee-report.md
          fail: true

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Link Check"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Result: ${{ steps.lychee.outcome }}"
            echo ""
            if [ -f lychee-report.md ]; then
              cat lychee-report.md
            else
              echo "lychee-report.md was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: warn

      - name: Fail if Lychee failed
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "::error::Lychee link check failed. Full report:"
          if [ -f lychee-report.md ]; then
            cat lychee-report.md
          else
            echo "lychee-report.md was not generated."
          fi
          exit 1
