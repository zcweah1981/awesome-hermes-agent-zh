# awesome-hermes-agent-zh — Content Integrity Check
# PR / push 触发：校验 docs、route-map、packs 与关键公开结构
name: content-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Verify canonical route order
        run: python scripts/normalize_route_order.py

      - name: Verify content quality baseline
        run: python scripts/content_quality_check.py

      - name: Check critical paths exist
        run: |
          echo "🔍 Checking critical path structure..."
          for dir in docs/ packs/ assets/ governance/; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing critical directory: $dir"
              exit 1
            fi
          done
          for file in README.md governance/README.md governance/repo-structure.md governance/site-route-map.yaml governance/content-contract.md governance/packs-map.md governance/publishing-checklist.md; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing critical file: $file"
              exit 1
            fi
          done
          echo "✅ All critical paths present"

      - name: Validate route map sources
        run: |
          echo "🔍 Checking governance/site-route-map.yaml..."
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          route_file = root / 'governance/site-route-map.yaml'
          data = yaml.safe_load(route_file.read_text()) or {}
          routes = data.get('routes', [])
          if not routes:
              raise SystemExit('❌ No routes found in governance/site-route-map.yaml')

          missing = []
          required = ['source', 'slug', 'module', 'title', 'order', 'status']
          for idx, route in enumerate(routes, 1):
              for key in required:
                  if key not in route:
                      raise SystemExit(f'❌ route #{idx} missing required field: {key}')
              if not (root / route['source']).exists():
                  missing.append(route['source'])

          if missing:
              raise SystemExit('❌ Missing route sources:\n' + '\n'.join(missing))
          print(f'✅ Validated {len(routes)} route sources')
          PY

      - name: Validate packs manifests
        run: |
          echo "🔍 Checking packs/ manifests..."
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          manifests = sorted(root.glob('packs/*/manifest.yaml'))
          if not manifests:
              raise SystemExit('❌ No pack manifests found')

          required = ['id', 'title', 'category', 'summary', 'modes', 'doc', 'install', 'download', 'status', 'order']
          for mf in manifests:
              data = yaml.safe_load(mf.read_text()) or {}
              for key in required:
                  if key not in data:
                      raise SystemExit(f'❌ {mf} missing required field: {key}')
              for key in ['doc', 'install', 'download']:
                  path = root / data[key]
                  if not path.exists():
                      raise SystemExit(f'❌ {mf}: {key} points to missing path: {data[key]}')
          print(f'✅ Validated {len(manifests)} pack manifests')
          PY

      - name: Summary
        run: |
          DOCS=$(find docs/ -name "*.md" | wc -l)
          PACKS=$(find packs/ -name "manifest.yaml" | wc -l)
          ASSETS=$(find assets/ -type f | wc -l)
          GOVERNANCE=$(find governance/ -maxdepth 1 -type f | wc -l)
          echo ""
          echo "📊 Content Summary:"
          echo "   Markdown docs: $DOCS"
          echo "   Pack manifests: $PACKS"
          echo "   Root assets: $ASSETS"
          echo "   Governance files: $GOVERNANCE"
